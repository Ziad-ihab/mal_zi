            <!--
                =====================================================
                إزاي تضيف خانة (Category) جديدة:

                1) في الأزرار تحت، كوبي زرار زي دول:
                   <button class="filter-btn" data-filter="ISM_JEDID">اسم الخانة</button>

                2) على كل صورة جديدة في memories-grid تحت، حط
                   data-category="ISM_JEDID" لنفس الاسم اللي كتبته فوق.

                3) عادي تضيف أي عدد صور تحت أي خانة - مفيش حد أقصى،
                   الجريد بيتوسع لوحده.
                =====================================================
            -->

            <div class="gallery-filters">

            </div>
